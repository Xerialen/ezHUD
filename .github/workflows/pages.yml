# Build the FTE-web editor and publish one complete, sanitized Pages site.
#
# A Pages deployment replaces the whole site. Every run therefore starts from
# the currently deployed, hash-manifested site and replaces exactly one subtree:
# main at /, dev at /dev/, or a manual branch preview at /preview/<name>/.
# tools/fte-web/pages-site.mjs preserves and guards the other public subtrees.
name: Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      name:
        description: Preview URL name (lowercase letters, digits, hyphens)
        required: true
        type: string

permissions:
  contents: read

# Deployment is the state lock. The deploy job does not finish until the new
# public manifest and the release/preview index proofs are visible through the
# Pages CDN, so the next run cannot preserve a stale predecessor.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FTEQW_SHA: 9d8aa3815c65ac65d1f2950eb4d876da51d5635f
  EMSDK_VERSION: 6.0.5
  QUAKE106_URL: https://ftp.gwdg.de/pub/misc/ftp.idsoftware.com/idstuff/quake/quake106.zip
  NQUAKE_PK3_URL: https://raw.githubusercontent.com/nQuake/distfiles/d93997920e028343eee24377f75b2addff066990/non-gpl/qw/nquake.pk3
  GPL_MAPS_URL: https://raw.githubusercontent.com/nQuake/distfiles/d93997920e028343eee24377f75b2addff066990/gpl/id1/gpl_maps.pk3
  WEB_ASSETS_BASE: https://github.com/Xerialen/ezHUD/releases/download/web-assets-v1
  PAGES_URL: https://xerialen.github.io/ezHUD/

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Keep publication/allowlist code on the workflow ref and source-under-test
      # in a separate checkout. A preview branch need not contain this workflow.
      - name: Check out publication controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Resolve publication mode and base path
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            node control/tools/fte-web/pages-site.mjs validate-name --name "$PREVIEW_NAME"
            echo "PUBLICATION_MODE=preview" >> "$GITHUB_ENV"
            echo "PREVIEW_NAME=$PREVIEW_NAME" >> "$GITHUB_ENV"
            echo "BASE_PATH=/ezHUD/preview/$PREVIEW_NAME/" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = dev ]; then
            echo "PUBLICATION_MODE=dev" >> "$GITHUB_ENV"
            echo "BASE_PATH=/ezHUD/dev/" >> "$GITHUB_ENV"
          else
            echo "PUBLICATION_MODE=release" >> "$GITHUB_ENV"
            echo "BASE_PATH=/ezHUD/" >> "$GITHUB_ENV"
          fi
          echo "PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Check out source to publish
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.sha }}
          path: source

      - name: Record the exact source commit
        run: echo "SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check out fteqw at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: Xerialen/fteqw
          ref: ${{ env.FTEQW_SHA }}
          path: fteqw

      - name: Apply the source branch's engine patches
        working-directory: fteqw
        run: git apply --verbose "$GITHUB_WORKSPACE/source/spikes/fte-web/fteqw.diff"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Restore the engine build tree
        uses: actions/cache@v4
        with:
          path: fteqw/engine/release
          # No restore-keys: these objects belong to one toolchain/source/patch triple.
          key: fteqw-release-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ env.FTEQW_SHA }}-${{ hashFiles('source/spikes/fte-web/fteqw.diff') }}

      - name: Build ftewebglcl
        working-directory: fteqw/engine
        run: |
          set -eo pipefail
          unset CFLAGS CXXFLAGS LDFLAGS
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          rm -f release/ftewebglcl.js release/ftewebglcl.wasm release/ftewebglcl.html
          make webcl-rel -j"$(nproc)"

      - name: Verify the patched exports survived the link
        run: |
          js=fteqw/engine/release/ftewebglcl.js
          grep -q _EZHud_StateJSON "$js"
          grep -qF 'Module["UTF8ToString"]' "$js"
          grep -qF 'addRunDependency' "$js"

      - name: Download hash-pinned public game data
        run: |
          set -eo pipefail
          pins="$GITHUB_WORKSPACE/source/tools/fte-web/game-data.sha256"
          mkdir -p downloads
          cd downloads
          verify() { grep -E "  $1\$" "$pins" | sha256sum -c -; }

          curl -fsSL --retry 3 --retry-delay 5 -o quake106.zip "$QUAKE106_URL"
          verify quake106.zip
          unzip -q quake106.zip resource.1
          sevenzip=$(command -v 7z || command -v 7zz || command -v 7za)
          "$sevenzip" e -y -o. resource.1 ID1/PAK0.PAK > /dev/null
          mv PAK0.PAK pak0.pak
          verify pak0.pak

          curl -fsSL --retry 3 --retry-delay 5 -o nquake.pk3 "$NQUAKE_PK3_URL"
          verify nquake.pk3
          curl -fsSL --retry 3 --retry-delay 5 -o gpl_maps.pk3 "$GPL_MAPS_URL"
          verify gpl_maps.pk3
          for asset in hudtest_src.mvd tb4gf_book_vs_s.mvd qrp-dm3.pk3; do
            curl -fsSL --retry 3 --retry-delay 5 -o "$asset" "$WEB_ASSETS_BASE/$asset"
            verify "$asset"
          done

          gd="$GITHUB_WORKSPACE/game-data"
          mkdir -p "$gd/id1" "$gd/qw/demos"
          cp pak0.pak nquake.pk3 gpl_maps.pk3 qrp-dm3.pk3 "$gd/id1/"
          cp hudtest_src.mvd tb4gf_book_vs_s.mvd "$gd/qw/demos/"

      - name: Install test dependencies
        working-directory: source
        run: npm ci

      - name: Install ffmpeg (required by changedrop_capture video validation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Tier 1 (core units, C placement tests, public-dist guard)
        working-directory: source
        run: npm run test:tier1

      - name: Tier 3F (FTE page against the fake engine)
        working-directory: source
        run: npm run test:tier3:fte

      - name: Assemble the selected release, dev build, or preview
        working-directory: source
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/publication" \
          ENGINE_DIR="$GITHUB_WORKSPACE/fteqw/engine/release" \
          GAME_DATA_DIR="$GITHUB_WORKSPACE/game-data" \
          BASE_PATH="$BASE_PATH" \
          bash tools/fte-web/assemble-public.sh

      - name: Guard the real branch artifact with the publication allowlist
        run: node control/tools/fte-web/pages-site.mjs guard-artifact --dir publication --base-path "$BASE_PATH"

      - name: Tier 4F (the selected artifact end to end in Chrome)
        working-directory: source
        run: DIST_DIR="$GITHUB_WORKSPACE/publication" BASE_PATH="$BASE_PATH" npm run test:tier4:fte

      - name: Upload tier 4F artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier4-fte-artifacts
          path: /tmp/ezhud-tier4-fte-artifacts
          if-no-files-found: ignore

      - name: Fetch and verify the complete currently deployed site
        run: |
          node control/tools/fte-web/pages-site.mjs fetch \
            --base-url "$PAGES_URL" \
            --bootstrap control/tools/fte-web/pages-bootstrap-1950c15.json \
            --output current-site \
            --cache-key "$DEPLOYMENT_ID"

      - name: Compose the complete replacement artifact
        env:
          SOURCE_REF: ${{ inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$PUBLICATION_MODE" = preview ]; then
            node control/tools/fte-web/pages-site.mjs compose-preview \
              --current current-site --artifact publication --output pages-site \
              --name "$PREVIEW_NAME" --ref "$SOURCE_REF" --commit "$SOURCE_SHA" \
              --published-at "$PUBLISHED_AT" --deployment "$DEPLOYMENT_ID"
          elif [ "$PUBLICATION_MODE" = dev ]; then
            node control/tools/fte-web/pages-site.mjs compose-dev \
              --current current-site --artifact publication --output pages-site \
              --ref "$SOURCE_REF" --commit "$SOURCE_SHA" \
              --published-at "$PUBLISHED_AT" --deployment "$DEPLOYMENT_ID"
          else
            node control/tools/fte-web/pages-site.mjs compose-release \
              --current current-site --artifact publication --output pages-site \
              --deployment "$DEPLOYMENT_ID"
          fi
          node control/tools/fte-web/pages-site.mjs verification-bundle \
            --site pages-site --output pages-verification

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Upload live-verification proof
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-verification
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out publication controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Download the expected manifest and preservation proofs
        uses: actions/download-artifact@v4
        with:
          name: pages-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-verification

      - name: Prove the release root, dev build, and every preview survived
        run: |
          node control/tools/fte-web/pages-site.mjs verify-remote \
            --base-url "$PAGES_URL" \
            --expected-manifest pages-verification/pages-manifest.json \
            --proof-dir pages-verification \
            --cache-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
